# 매일 06:00(한국시간) 수집 → 분석 → 기획안 → 사이트 배포. Actions 탭에서 'Run workflow'로 바로 돌릴 수도 있다.
name: daily-research

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = 한국시간 06:00
  workflow_dispatch:
    inputs:
      instagram:
        description: "인스타도 수집 (Apify 비용 약 1달러 + 해시태그 공식 API — 평소엔 끄기)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic pydantic

      - name: 수집·분석
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          # 인스타 API 는 하루 1번(06:00 정기 실행)만 부른다. 손으로 돌릴 땐 'instagram' 을 켰을 때만.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.instagram }}" = "true" ]; then
            python own_collect.py
            python apify_instagram.py           # 참고 계정 게시물·릴스 조회수 (Apify — 메타 API 안 씀)
            python collect.py --hashtags-only   # 해시태그 인기 게시물만 공식 API로 (하루 6~7번 호출)
          else
            echo "수동 실행이라 인스타 수집은 건너뛰어요 (지난 데이터로 분석)"
          fi
          python google_collect.py
          python press_collect.py
          python threads_collect.py
          python threads_links.py
          python apify_threads.py
          python threads_viral.py --export || true
          python x_collect.py
          python analyze.py --no-open
          python export_site.py

      - name: 기획안 작성 (Claude)
        continue-on-error: true   # 실패해도 지난 기획안으로 사이트는 배포
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_drafts.py

      - name: 한국에 안 풀린 해외 콘텐츠 찾기 (Claude)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python import_ideas.py

      - name: 팀이 모은 쓰레드 글 분석 (Claude)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python threads_analyze.py

      - name: X·트루스 경제 글 분석 (Claude)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python x_analyze.py
          python threads_mine_analyze.py

      - name: 사이트 만들기
        run: python build_site.py

      - name: 수집 데이터 저장 (팔로워 추이용)
        continue-on-error: true   # 저장이 실패해도 사이트 배포는 계속
        run: |
          git config user.name "content-lab-bot"
          git config user.email "content-lab-bot@users.noreply.github.com"
          git add data/insta.db output/site
          git commit -m "data: $(date -u +%Y-%m-%d) 자동 수집" || echo "변경 없음"
          git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true   # 겹치면 이번 실행 결과를 우선
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 인스타 연결이 끊기면 이 단계가 실패 → GitHub 이 저장소 주인에게 메일로 알림 (사이트 배포는 이미 끝난 뒤)
  instagram-health:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 인스타 연결 확인
        run: |
          python3 - <<'EOF'
          import json, os, sys
          if not os.path.exists("output/site/ig_health.json"):
              sys.exit(0)
          h = json.load(open("output/site/ig_health.json", encoding="utf-8"))[0]
          print(h)
          if h["status"] == "blocked":
              print("::error::인스타 연결이 끊겼어요: " + h["message"])
              sys.exit(1)
          EOF
