# 내 PC(tg_live.py)가 30분마다 텔레그램 통계(output/site/tg_*.json)를 올리면 → 사이트 다시 배포.
# Claude 오늘의 문구는 tg_analyze.py 가 하루 한 번(07시 이후 첫 실행)만 쓴다.
name: telegram

on:
  push:
    paths:
      - output/site/tg_hot.json
      - output/site/tg_meta.json
      - output/site/tg_source.json
      - output/site/tg_streak.json
  workflow_dispatch:
    inputs:
      force:
        description: "차례가 아니어도 Claude 추천을 다시 쓰기"
        type: boolean
        default: false
      focus:
        description: "이번에 특히 반영할 요청 (예: 지금 하락장이니 하락장 대응 문구)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: telegram-${{ github.event_name }}   # 손으로 돌린 실행은 30분마다 오는 자동 갱신에 밀려 취소되지 않게
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic pydantic

      - name: 텔레그램 분석 (Claude, 하루 3번 07·12·18시 — 그때는 뉴스부터 새로 받음)
        continue-on-error: true   # 실패해도 지난 추천으로 사이트는 배포
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_FOCUS: ${{ inputs.focus }}
        run: |
          if [ "${{ inputs.force }}" = "true" ] || python tg_analyze.py --due; then
            python press_collect.py || true
            python google_collect.py || true
            python analyze.py --no-open && python export_site.py
            python tg_analyze.py ${{ inputs.force && '--force' || '--scheduled' }}
          else
            echo "이번엔 텔레그램 추천을 다시 쓸 차례가 아니에요"
          fi

      - name: 시황 자동 변환 (Claude Opus, 새 아침·마감 시황이 있을 때만)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tg_rewrite.py

      - name: 사이트 만들기
        run: python build_site.py

      - name: 분석 결과 저장
        continue-on-error: true
        run: |
          git config user.name "content-lab-bot"
          git config user.email "content-lab-bot@users.noreply.github.com"
          git add output/site/tg_*.json   # 텔레그램 결과만 (다른 파일은 매일 수집이 관리)
          git commit -m "data: 텔레그램 분석 $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true   # 겹치면 이번 실행 결과를 우선
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
