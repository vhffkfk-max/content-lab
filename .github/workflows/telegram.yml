# 내 PC가 텔레그램 통계(tg_live.py)나 Claude 결과(local_ai.py, Max 구독)를 올리면 → 사이트 다시 배포.
# Claude 는 깃허브에서 부르지 않는다 (API 요금 방지). 사이트 버튼은 PC에 요청만 남긴다(ai_request.py).
name: telegram

on:
  push:
    paths:
      - output/site/tg_hot.json
      - output/site/tg_meta.json
      - output/site/tg_source.json
      - output/site/tg_streak.json
      - output/site/trd_rooms.json
      - output/site/tg_ai.json
      - output/site/tg_rewrites.json
      - output/site/trd_posts.json
      - output/site/drafts.json
      - output/site/imports.json
      - output/site/threads_ai.json
      - output/site/x_ai.json
      - output/site/thm_ai.json
  workflow_dispatch:
    inputs:
      force:
        description: "차례가 아니어도 Claude 추천을 다시 쓰기"
        type: boolean
        default: false
      focus:
        description: "이번에 특히 반영할 요청 (예: 지금 하락장이니 하락장 대응 문구)"
        type: string
        default: ""
      traders:
        description: "트레이더스 방별 올릴 글을 지금 다시 쓰기"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: telegram-${{ github.event_name }}   # 손으로 돌린 실행은 30분마다 오는 자동 갱신에 밀려 취소되지 않게
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PC에 Claude 작업 요청 (사이트 버튼으로 실행했을 때)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          FOCUS: ${{ inputs.focus }}
        run: |
          git config user.name "content-lab-bot"
          git config user.email "content-lab-bot@users.noreply.github.com"
          if [ "${{ inputs.force }}" = "true" ]; then python ai_request.py tg "focus=$FOCUS"; fi
          if [ "${{ inputs.traders }}" = "true" ]; then python ai_request.py trd; fi
          git add data/ai_requests.json
          git commit -m "ai: PC에 Claude 작업 요청" || echo "변경 없음"
          git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true
          git push

      - name: 사이트 만들기
        run: python build_site.py


      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
