# 내 PC(tg_live.py)가 30분마다 텔레그램 통계(output/site/tg_*.json)를 올리면 → 사이트 다시 배포.
# Claude 오늘의 문구는 tg_analyze.py 가 하루 한 번(07시 이후 첫 실행)만 쓴다.
name: telegram

on:
  push:
    paths:
      - output/site/tg_hot.json
      - output/site/tg_meta.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-research   # 매일 수집과 겹치지 않게 차례로
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic pydantic

      - name: 텔레그램 분석 (Claude)
        continue-on-error: true   # 실패해도 지난 추천으로 사이트는 배포
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tg_analyze.py

      - name: 사이트 만들기
        run: python build_site.py

      - name: 분석 결과 저장
        continue-on-error: true
        run: |
          git config user.name "content-lab-bot"
          git config user.email "content-lab-bot@users.noreply.github.com"
          git add output/site
          git commit -m "data: 텔레그램 분석 $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git pull --rebase --autostash || true
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
