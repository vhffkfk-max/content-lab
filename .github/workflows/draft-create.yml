name: draft-create
# 카드뉴스 초안 만들기 (작업지시서 Phase 4) — 내 PC(local_ai.py)가 Max 구독으로 글을 쓰고 그려서 텔레그램 봇으로 보낸다.
# 여기서는 PC에 요청만 남긴다 (깃허브에서 Claude API 를 부르지 않음 — 요금 방지). 이미지는 PC의 output/cardnews/drafts/.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "주제 (비우면 추천 1위, 오늘 이미 만든 주제는 건너뜀)"
        required: false
        default: ""
      pick:
        description: "추천안에서 고른 것 (추천안id|표지번호|폼|글꼴|short)"
        required: false
        default: ""
      trader:
        description: "차트덕후 트레이더 분석 원문 (있으면 쓰레드 글로 변환)"
        required: false
        default: ""
      trader_rid:
        description: "트레이더 분석 요청 번호"
        required: false
        default: ""
      photos:
        description: "트레이더 분석 사진 수"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PC에 카드뉴스 초안 요청
        env:
          TOPIC: ${{ inputs.topic }}
          PICK: ${{ inputs.pick }}
          TRADER: ${{ inputs.trader }}
          TRADER_RID: ${{ inputs.trader_rid }}
          PHOTOS: ${{ inputs.photos }}
        run: |
          git config user.name "content-lab-bot"
          git config user.email "content-lab-bot@users.noreply.github.com"
          if [ -n "$TRADER" ]; then
            python ai_request.py trader "text=$TRADER" "rid=$TRADER_RID" "photos=$PHOTOS"
          else
            python ai_request.py draft "topic=$TOPIC" "pick=$PICK"
          fi
          git add data/ai_requests.json
          git commit -m "ai: PC에 Claude 작업 요청" || echo "변경 없음"
          for i in 1 2 3 4 5; do   # PC·다른 봇이 같은 때 올리면 밀림 → 받아서 다시
            git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true
            git push && break
            sleep $((i * 4))
          done
