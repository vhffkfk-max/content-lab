# 수집 없이 분석·Claude 쓰레드 분석·사이트만 다시 (수동 실행 전용 — 분석 방식을 바꿨을 때 바로 반영)
name: reanalyze

on:
  workflow_dispatch:
    inputs:
      collect_threads:
        description: "쓰레드·X 다시 반영 (무료)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic
      - name: 쓰레드 수집 (선택)
        if: ${{ inputs.collect_threads }}
        run: |
          python free_import.py   # Apify 끔 — 쓰레드는 내 PC 무료 크롤러 결과
          python x_collect.py
      - name: 분석
        run: |
          python analyze.py --no-open
          python export_site.py
      - name: PC에 Claude 작업 요청 (쓰레드·X 분석은 내 PC가 Max 구독으로)
        run: python ai_request.py social
      - name: 사이트 만들기
        run: python build_site.py
      - name: 결과 저장
        continue-on-error: true
        run: |
          git config user.name "content-lab-bot"
          git config user.email "content-lab-bot@users.noreply.github.com"
          git add output/site data/insta.db data/ai_requests.json
          git commit -m "data: 다시 분석 $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true   # 겹치면 이번 실행 결과를 우선
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
