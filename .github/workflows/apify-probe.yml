# Apify 수집기 시험 (소량, 수동 실행 전용)
name: apify-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python apify_probe.py
