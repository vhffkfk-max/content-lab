name: card-publish
# 사이트 '카드뉴스 발행' 버튼 — 대표가 고른 초안 하나를 @hotconomy 에 올린다. 내 PC(local_ai.py → publish/publish_card.py)가 처리한다.
# 여기서는 PC에 요청만 남긴다. 대표 계정이 누른 것만 받는다.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "초안 id (예: 20261101-1805-bignum)"
        required: true

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  request:
    if: github.actor == 'vhffkfk-max'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PC에 발행 요청
        env:
          DRAFT_ID: ${{ inputs.id }}
        run: |
          echo "$DRAFT_ID" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "초안 id 형식이 아니에요"; exit 1; }
          git config user.name "content-lab-bot"
          git config user.email "content-lab-bot@users.noreply.github.com"
          python ai_request.py publish "id=$DRAFT_ID"
          git add data/ai_requests.json
          git commit -m "ai: PC에 카드뉴스 발행 요청" || echo "변경 없음"
          git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true
          git push
