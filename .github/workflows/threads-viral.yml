name: threads-viral
# 조회수 10만+ 경제 쓰레드 대량 수집 (손으로 실행, Apify 약 15달러 상한) → DB·모음 저장 후 사이트 다시 만들기는 다음 06:00 실행에서
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 대량 수집
        env:
          PAID_OFF: "1"   # APIFY_TOKEN 뺌 — 2026-10-29 유료 수집(Apify) 끔. 다시 쓰려면 APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }} 로 되돌리기
        run: python threads_viral.py
      - name: 저장
        run: |
          git config user.name "content-lab-bot"
          git config user.email "content-lab-bot@users.noreply.github.com"
          git add data/insta.db output/site/thx_viral.json output/site/thx_viral_meta.json
          git commit -m "data: 쓰레드 조회수 10만+ 대량 수집 $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git pull --rebase -X theirs --autostash || (git rebase --abort; git pull --no-rebase -X ours --no-edit) || true
          git push
