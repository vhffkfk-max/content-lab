<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>쓰레드 연결 · 컨텐츠 연구소</title>
<style>
:root{--ground:#fbf7f8;--surface:#fff;--text:#18131a;--muted:#5f5860;--accent:#b8336a;--border:#ece4e7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ground:#141012;--surface:#1c1719;--text:#f4eef1;--muted:#b9adb2;--accent:#e2719d;--border:#342a2e;color-scheme:dark}}
body{margin:0;background:var(--ground);color:var(--text);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;line-height:1.7;word-break:keep-all}
main{max-width:640px;margin:0 auto;padding:48px max(16px,4vw)}
h1{font-size:24px;margin:0 0 8px}.muted{color:var(--muted)}
.code{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:15px;overflow-wrap:anywhere;margin:12px 0}
button{min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body><main>
<h1 id="title">쓰레드 연결</h1>
<p class="muted" id="desc">잠시만요…</p>
<div class="code" id="code" hidden></div>
<button type="button" id="copy" hidden>코드 복사</button>
<script>
// 쓰레드 로그인 후 돌아오는 페이지. 서버가 없으니 받은 일회용 코드를 보여주고, 운영자가 threads_auth.py 에 붙여넣는다.
// 코드는 1시간 안에 한 번만 쓸 수 있고, 앱 비밀키 없이는 토큰으로 바꿀 수 없다.
const q = new URLSearchParams(location.search);
const code = (q.get('code') || '').replace(/#_$/, '');
const title = document.getElementById('title'), desc = document.getElementById('desc'), box = document.getElementById('code'), btn = document.getElementById('copy');
if (q.get('error')) {
  title.textContent = '연결을 취소했어요';
  desc.textContent = '쓰레드 권한 허용을 취소해서 연결되지 않았어요. 다시 하려면 threads_auth.py 를 다시 실행하세요.';
} else if (code) {
  title.textContent = '쓰레드 연결 코드를 받았어요';
  desc.textContent = '아래 코드를 복사해서 PC의 threads_auth.py 창에 붙여넣으세요. 코드는 1시간 안에 한 번만 쓸 수 있어요.';
  box.textContent = code; box.hidden = false; btn.hidden = false;
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); btn.textContent = '복사했어요'; } catch (e) { getSelection().selectAllChildren(box); btn.textContent = 'Ctrl+C 로 복사하세요'; }
  });
} else {
  desc.textContent = '이 페이지는 쓰레드 로그인 후 자동으로 열리는 페이지예요. 직접 들어오면 표시할 내용이 없어요.';
}
</script>
</main></body></html>
