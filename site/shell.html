<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8336a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연구소">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>말희아빠 &amp; 파로파트너스 컨텐츠 연구소</title>
<meta name="description" content="한국·해외 경제 인스타그램과 구글 뉴스를 분석해 오늘 올릴 콘텐츠를 추천합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 디자인 스킬(design-taste-frontend) 앱 스타일 'accent-ladder': 라즈베리 한 가지 색.
   진한 색은 작은 표시(버튼·데이터·선택된 메뉴)에만, 넓은 면은 그 색의 연한 톤으로. */
:root{
  --ground:#f8f9fb; --surface:#ffffff; --raised:#f1f3f6; --border:#e3e7ec; --rule:#eef1f4; --control:#cdd3da;
  --text:#17202b; --muted:#4b5563; --faint:#5f6b7a;
  --accent:#b8336a; --accent-soft:#fdf2f7; --accent-track:#f8dbe8; --accent-ink:#6b1d3e;
  --positive:#247b50; --negative:#c4242a; --warning:#92400e;
  --pill-positive-bg:#dcfce7; --pill-positive-ink:#14532d;
  --pill-negative-bg:#ffedea; --pill-negative-ink:#831c1e;
  --pill-warning-bg:#fff4dc; --pill-warning-ink:#92400e;
  --pill-neutral-bg:#eef1f4; --pill-neutral-ink:#334155;
  --pill-accent-bg:#fdf2f7; --pill-accent-ink:#6b1d3e;
  --chart-1:#b8336a; --chart-2:#b9b0b4;
  /* 채널 표시는 작은 점에만 */
  --ch-instagram:#b8336a; --ch-youtube:#d92d20; --ch-google:#2f6fdb; --ch-threads:#18131a; --ch-telegram:#1f8fcb; --ch-x:#0f1419;
  --radius-card:12px; --radius-control:8px; --gap:24px; --pad:24px;
  --fs-title:28px; --fs-section:18px; --fs-kpi:24px; --fs-body:15px; --fs-small:13px;
  --font:"DM Sans","Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --t-ui:180ms; --ease-out:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0f1217; --surface:#171b22; --raised:#1f242d; --border:#2c333d; --rule:#232932; --control:#3d4652;
  --text:#eef1f5; --muted:#aab3bf; --faint:#97a1ae;
  --accent:#e2719d; --accent-soft:#2b1a22; --accent-track:#4c2536; --accent-ink:#f7c6da;
  --positive:#4fc58e; --negative:#f07067; --warning:#e9a04e;
  --pill-positive-bg:#16291e; --pill-positive-ink:#6fdba5;
  --pill-negative-bg:#2e1818; --pill-negative-ink:#f59b94;
  --pill-warning-bg:#2d2213; --pill-warning-ink:#f0b86a;
  --pill-neutral-bg:#232932; --pill-neutral-ink:#cbd3dd;
  --pill-accent-bg:#2b1a22; --pill-accent-ink:#f7c6da;
  --chart-1:#e2719d; --chart-2:#5a4f54;
  --ch-instagram:#e2719d; --ch-youtube:#f0645a; --ch-google:#6c9cf5; --ch-threads:#e8e1e4; --ch-telegram:#5cb8e6; --ch-x:#e7e9ea;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.55;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<!--BODY-->
<script>
// 화면 코드가 쓰는 dash 기능만 작게 흉내 낸다. 데이터는 빌드할 때 아래에 그대로 들어간다.
window.LAB_DATA = /*DATA*/{};
(() => {
  const data = window.LAB_DATA;
  window.dash = {
    data: id => data[id] ? { status: 'ok', data: data[id] } : { status: 'missing', data: [] },
    onData: fn => fn(),
  };
})();
</script>
<!--SCRIPT-->
</body>
</html>
