<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- chart_report.py 가 __SPEC__·__LWC__ 를 채워 헤드리스 Chrome 으로 캡처한다.
     차트: TradingView Lightweight Charts™ (Apache 2.0) — assets/vendor -->
<style>
  :root { --bg:#131722; --text:#d1d4dc; --sub:#787b86; --up:#089981; --down:#f23645; }
  html, body { margin:0; background:var(--bg); overflow:hidden; color:var(--text);
               font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  #stage { position:relative; overflow:hidden; background:var(--bg); }
  #chart { position:absolute; z-index:0; }
  #stage > :not(#chart) { z-index:2; }
  #ov { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
  .mark { position:absolute; left:0; right:64px; text-align:center; color:#d1d4dc; opacity:.045; font-weight:600; white-space:nowrap; }
  .legend { position:absolute; left:12px; top:9px; font-size:var(--lg); line-height:1.5; white-space:nowrap; color:var(--sub); }
  .legend b { color:var(--text); font-weight:600; }
  .legend .up { color:var(--up); } .legend .dn { color:var(--down); }
  .legend .ma { margin-right:12px; }
  .note { position:absolute; font-size:var(--nt); line-height:1.15; white-space:nowrap; color:var(--c, var(--text)); padding:0 3px;
          background:rgba(19,23,34,.72); }
  .fib { position:absolute; font-size:var(--fb); line-height:1; white-space:nowrap; }
  .foot { box-sizing:border-box; position:absolute; left:0; right:0; bottom:0; padding:0 12px; display:flex; flex-wrap:wrap; align-items:center;
          justify-content:space-between; column-gap:20px; border-top:1px solid #2a2e39; background:var(--bg); }
  .foot .read { font-size:var(--ft); color:var(--text); white-space:nowrap; }
  .foot .cr { font-size:var(--cr); color:#5d606b; white-space:nowrap; }
</style></head>
<body>
<div id="stage"><div id="chart"></div><svg id="ov"></svg></div>
<script>window.onerror = (m, s, l) => { const e = document.createElement('pre'); e.id = 'err';
  e.style.cssText = 'position:absolute;left:10px;top:60px;color:#ff6b6b;z-index:9;font-size:14px'; e.textContent = m + ' @' + l; document.body.appendChild(e); };</script>
<script>__LWC__</script>
<script>
const S = __SPEC__;
S.fmtAxis = p => p <= 0 ? '' : S.krw ? (Math.round(p / (p >= 1e5 ? 100 : p >= 1e4 ? 10 : 1)) * (p >= 1e5 ? 100 : p >= 1e4 ? 10 : 1)).toLocaleString('en-US') : p >= 1000 ? Math.round(p).toLocaleString('en-US') : p >= 100 ? p.toFixed(1) : p >= 1 ? p.toFixed(2) : p.toFixed(4);
const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const stage = document.getElementById('stage'), box = document.getElementById('chart'), ov = document.getElementById('ov');
const L = S.layout;
stage.style.width = L.W + 'px'; stage.style.height = L.H + 'px';
document.body.style.width = L.W + 'px'; document.body.style.height = L.H + 'px';
Object.assign(box.style, { left: '0', top: '0', width: L.W + 'px', height: L.chartH + 'px' });
ov.setAttribute('width', L.W); ov.setAttribute('height', L.H);
for (const [k, v] of Object.entries(L.vars)) stage.style.setProperty(k, v);

const two = n => String(n).padStart(2, '0');
const chart = LightweightCharts.createChart(box, {
  width: L.W, height: L.chartH,
  layout: { background: { type: 'solid', color: '#131722' }, textColor: '#787b86', fontSize: L.axisFont,
            fontFamily: "'Segoe UI', 'Malgun Gothic', sans-serif", attributionLogo: false },
  grid: { vertLines: { color: '#1b1f2b' }, horzLines: { color: '#1b1f2b' } },
  rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: L.top, bottom: .2 } },
  timeScale: { borderColor: '#2a2e39', rightOffset: L.rightOffset, timeVisible: S.intraday, secondsVisible: false, lockVisibleTimeRangeOnResize: true,
    tickMarkFormatter: (t, type) => {
      const d = typeof t === 'number' ? (x => ({ year: x.getUTCFullYear(), month: x.getUTCMonth() + 1, day: x.getUTCDate(), h: x.getUTCHours(), m: x.getUTCMinutes() }))(new Date(t * 1000))
        : typeof t === 'object' ? t : (([y, m, dd]) => ({ year: +y, month: +m, day: +dd }))(String(t).split('-'));
      return type === 0 ? `${d.year}` : type === 1 ? `${d.month}월` : type === 2 ? `${d.month}/${d.day}` : `${two(d.h)}:${two(d.m)}`; } },
  crosshair: { vertLine: { visible: false, labelVisible: false }, horzLine: { visible: false, labelVisible: false } },
  localization: { priceFormatter: p => S.fmtAxis(p) },
  handleScroll: false, handleScale: false,
});
const cs = chart.addCandlestickSeries({ upColor: '#089981', downColor: '#f23645', borderVisible: false,
  wickUpColor: '#089981', wickDownColor: '#f23645', priceLineVisible: true, priceLineStyle: 2, priceLineWidth: 1, lastValueVisible: true });
cs.setData(S.candles);
cs.applyOptions({ priceLineColor: S.candles[S.candles.length - 1].close >= S.candles[S.candles.length - 1].open ? '#089981' : '#f23645' });
const vol = chart.addHistogramSeries({ priceScaleId: 'vol', priceFormat: { type: 'volume' }, priceLineVisible: false, lastValueVisible: false });
chart.priceScale('vol').applyOptions({ scaleMargins: { top: .85, bottom: 0 } });
vol.setData(S.volume);
for (const m of S.mas) chart.addLineSeries({ color: m.color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }).setData(m.data);
chart.timeScale().setVisibleLogicalRange({ from: -1, to: S.candles.length - 1 + L.rightOffset });

// ── 겹쳐 그리기 (차트 좌표 → 무대 좌표) ──
const SVG = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); ov.appendChild(e); return e; };
const X = t => chart.timeScale().timeToCoordinate(t);
const Y = p => cs.priceToCoordinate(p);
const placed = [];
const overlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));

function draw() {
  const ts = chart.timeScale(), plotW = L.W - chart.priceScale('right').width();
  const plot = { x: 6, y: L.legendH, w: plotW - 12, h: L.chartH * .8 - L.legendH };
  const lastX = X(S.candles[S.candles.length - 1].time);
  const bars = S.candles.map(c => ({ x: X(c.time), y1: Y(c.high), y2: Y(c.low) }));
  const legendBox = document.querySelector('.legend').getBoundingClientRect();
  placed.push({ x: legendBox.left, y: legendBox.top, w: legendBox.width, h: legendBox.height });

  // 피보나치: 작도 도구처럼 고점·저점에서 시작해 오른쪽 끝까지
  if (S.fib) {
    const x0 = X(S.fib.from) ?? 0, lv = S.fib.levels;
    const lvy = lv.map(l => Y(l.price));
    if (S.fib.a && S.fib.b && X(S.fib.a.t) != null && X(S.fib.b.t) != null)
      svg('line', { x1: X(S.fib.a.t), y1: Y(S.fib.a.p), x2: X(S.fib.b.t), y2: Y(S.fib.b.p), stroke: '#787b86', 'stroke-width': 1, 'stroke-dasharray': '3 4' });
    const gold = lv.findIndex(l => l.r === .5), g2 = lv.findIndex(l => l.r === .618);
    if (gold >= 0 && g2 >= 0) svg('rect', { x: x0, y: Math.min(lvy[gold], lvy[g2]), width: plotW - x0, height: Math.abs(lvy[g2] - lvy[gold]), fill: '#c9a227', opacity: .07 });
    lv.forEach((l, i) => {
      const y = lvy[i];
      if (y < 0 || y > L.chartH * .8) return;
      svg('line', { x1: x0, x2: plotW, y1: y, y2: y, stroke: l.color, 'stroke-width': 1, opacity: .55 });
      const t = $('div', 'fib', l.label); t.style.color = l.color; stage.appendChild(t);
      const w = t.offsetWidth, h = t.offsetHeight;
      t.style.top = (y - h - 2) + 'px'; t.style.left = (plotW - w - 5) + 'px';
      placed.push({ x: plotW - w - 5, y: y - h - 2, w, h });
    });
  }
  // 수평선
  for (const h of S.hlines) if (Y(h.price) >= 0 && Y(h.price) <= L.chartH * .8) svg('line', { x1: 0, x2: plotW, y1: Y(h.price), y2: Y(h.price), stroke: h.color, 'stroke-width': 1, ...(h.dash ? { 'stroke-dasharray': h.dash } : {}) });
  // 추세선
  for (const t of S.tlines) svg('line', { x1: X(t.t1), y1: Y(t.p1), x2: X(t.t2), y2: Y(t.p2), stroke: t.color, 'stroke-width': 1.5 });
  // 글자: 캔들·다른 글자를 가장 덜 가리는 자리
  for (const c of S.notes) {
    const e = $('div', 'note', c.text); e.style.setProperty('--c', c.color || '#d1d4dc'); stage.appendChild(e);
    const w = e.offsetWidth, h = e.offsetHeight, ay = Y(c.price), ax = c.time != null ? X(c.time) : null;
    if (!isFinite(ay) || (c.time != null && ax == null)) { e.remove(); continue; }
    const cands = [];
    if (ax == null) {   // 선 이름표: 선 바로 위를 왼쪽부터 따라가며
      for (let x = plot.x; x + w < Math.min(lastX, plot.x + plot.w); x += 16) for (const y of [ay - h - 1, ay + 2]) cands.push({ x, y, pen: x * .02 });
    } else {            // 고점은 위, 저점은 아래
      const dy = c.side === 'low' ? [5, 12, 22] : [-h - 5, -h - 12, -h - 22];
      for (const d of dy) for (const dx of [-w / 2, -w, 0, -w - 10, 10]) cands.push({ x: ax + dx, y: ay + d, pen: Math.abs(d) + Math.abs(dx + w / 2) * .2 });
    }
    let best = null;
    for (const { x, y, pen } of cands) {
      const r = { x, y, w, h };
      let s = pen, hit = 0;
      if (x < plot.x || y < plot.y || x + w > plot.x + plot.w || y + h > plot.y + plot.h) s += 1e6;
      for (const p of placed) hit += overlap(r, { x: p.x - 3, y: p.y - 3, w: p.w + 6, h: p.h + 6 });
      s += hit * 30;
      for (const b of bars) if (b.x > x - 2 && b.x < x + w + 2) s += Math.max(0, Math.min(y + h, b.y2) - Math.max(y, b.y1)) * 2;
      if (!best || s < best.s) best = { s, x, y, hit };
    }
    if (!best || best.s >= 1e6) { e.remove(); continue; }
    e.style.left = best.x + 'px'; e.style.top = best.y + 'px';
    placed.push({ x: best.x, y: best.y, w, h });
  }
  document.title = 'ready';
}

const mk = $('div', 'mark', S.mark);
Object.assign(mk.style, { top: (L.chartH * .32) + 'px', fontSize: L.markFont + 'px' }); stage.appendChild(mk);
stage.appendChild($('div', 'legend', S.legend));
const ft = $('div', 'foot', `<span class="read">${S.read}</span><span class="cr">${S.credit}</span>`);
ft.style.height = (L.H - L.chartH) + 'px'; stage.appendChild(ft);
requestAnimationFrame(() => requestAnimationFrame(draw));
</script>
</body></html>
